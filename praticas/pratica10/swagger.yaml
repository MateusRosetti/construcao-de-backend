openapi: 3.0.0
info:
  title: Minha API REST
  version: 0.1
servers:
  - url: http://localhost:3000/
tags:
  - name: usuarios
paths:
components:
  schemas:
  securitySchemes:

paths:
  /usuarios:
    post:
      tags:
        - usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Email e Senha são obrigatórios

components:
  schemas:
    Usuario:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
paths:
  /usuarios/renovar:
    post:
      tags:
        - usuarios
      security:
        - JWTAuth: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'

components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      name: authorization
      in: header

  schemas:
    Mensagem:
      type: object
      properties:
        msg:
          type: string
        token:
          type: string
paths:
  /usuarios/renovar:
    post:
      tags:
        - usuarios
      security:
        - JWTAuth: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'

components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      name: authorization
      in: header

  schemas:
    Mensagem:
      type: object
      properties:
        msg:
          type: string
        token:
          type: string
/usuarios:
  delete:
    tags:
      - usuarios
    summary: Remove um usuário
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - usuario
            properties:
              usuario:
                type: string
    responses:
      "204":
        description: Removido com sucesso (sem conteúdo)
